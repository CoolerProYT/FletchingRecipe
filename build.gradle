plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me" }
	maven {
		url 'https://maven.blamejared.com'
	}
	maven {
		url "https://www.cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    mavenLocal()
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
    accessWidenerPath = file("src/main/resources/fletchingrecipe.classtweaker");
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation include("com.electronwill.night-config:core:3.8.1")
    implementation include("com.electronwill.night-config:toml:3.8.1")

    compileOnly("mezz.jei:jei-26.1-snapshot-4-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-26.1-snapshot-4-fabric:${jei_version}")

//    compileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
//    compileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

//    compileOnly "maven.modrinth:more-fletching-tables:1.8.3-fabric,1.21.11"
    compileOnly "com.coolerpromc:arrowplus:3.2.2+26.1-snapshot-7-fabric"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            groupId = groupId
            artifactId = archives_base_name
            version = mod_version
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

publishMods {
    file.set(jar.archiveFile)
    type = STABLE
    modLoaders.add("fabric")
    changelog = file("changelog.md").text
    displayName = "fletchingrecipe-" + mod_version

    curseforge {
        projectId = "1364606"
        accessToken = findProperty("CF_TOKEN")
        minecraftVersions.add("26.1-snapshot")
    }

    modrinth {
        projectId = 'nDfK7W8j'
        accessToken = findProperty("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
    }
}